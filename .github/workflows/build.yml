name: Build Windows EXE (custom launcher)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml wheel setuptools pywin32-ctypes

      - name: Compile PyInstaller's launcher from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "$env:RUNNER_TEMP\pyi-src"
          
          Write-Host "=== Cloning PyInstaller v6.22.3 ==="
          git clone --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git $src
          
          Write-Host "=== Building bootloader (64-bit) ==="
          Push-Location "$src\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "waf failed with exit code $LASTEXITCODE" }
          Pop-Location
          
          Write-Host "=== Installing custom PyInstaller ==="
          Push-Location $src
          pip install --force-reinstall --no-deps .
          if ($LASTEXITCODE -ne 0) { throw "pip install failed with exit code $LASTEXITCODE" }
          Pop-Location
          
          Write-Host "=== Verifying PyInstaller version ==="
          pyinstaller --version

      - name: Build EXE with custom PyInstaller
        run: |
          pyinstaller --clean --noconfirm TestLinkCRXMLGen.spec

      - name: List output
        run: |
          dir dist
          if (Test-Path dist\TestLinkCRXMLGen) { dir dist\TestLinkCRXMLGen }

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows-custom-launcher
          path: dist/TestLinkCRXMLGen/
          retention-days: 30
