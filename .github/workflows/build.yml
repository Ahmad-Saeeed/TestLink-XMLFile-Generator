name: Build Windows EXE (Nuitka)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml nuitka ordered-set zstandard

      - name: Build with Nuitka (standalone)
        run: |
          python -m nuitka ^
            --standalone ^
            --windows-disable-console ^
            --enable-plugin=tk-inter ^
            --include-package=docx ^
            --include-package=lxml ^
            --include-module=extract_isd ^
            --include-module=build_xml ^
            --output-dir=dist ^
            --output-filename=TestLinkCRXMLGen.exe ^
            --assume-yes-for-downloads ^
            --remove-output ^
            app.py

      - name: List output
        run: |
          dir dist
          dir dist\app.dist

      - name: Upload EXE folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows
          path: dist/app.dist/
          retention-days: 30
