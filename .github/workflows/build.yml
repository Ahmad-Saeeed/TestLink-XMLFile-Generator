name: Build Windows EXE (Nuitka)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml "nuitka>=2.4" ordered-set zstandard

      - name: Build with Nuitka
        shell: cmd
        run: |
          python -m nuitka --standalone --onefile --windows-disable-console --enable-plugin=tk-inter --include-package-data=docx --include-module=extract_isd --include-module=build_xml --output-dir=dist --output-filename=TestLinkCRXMLGen.exe --assume-yes-for-downloads --remove-output app.py

      - name: List output
        run: dir dist

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows
          path: dist/TestLinkCRXMLGen.exe
          retention-days: 30
