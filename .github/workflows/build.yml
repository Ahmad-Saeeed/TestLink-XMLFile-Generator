name: Build Windows EXE (custom launcher)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml

      - name: Compile PyInstaller's launcher from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP/pyi-src"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location "$env:RUNNER_TEMP/pyi-src/bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          Push-Location "$env:RUNNER_TEMP/pyi-src"
          pip install --force-reinstall --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build EXE with PyInstaller (custom bootloader)
        run: pyinstaller --clean --noconfirm TestLinkCRXMLGen.spec

      - name: List output
        run: |
          dir dist
          dir dist\TestLinkCRXMLGen

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows-custom-launcher
          path: dist/TestLinkCRXMLGen/
          retention-days: 30
