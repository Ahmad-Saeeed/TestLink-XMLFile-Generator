name: Build Windows EXE (custom launcher)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml wheel setuptools pywin32-ctypes

      - name: Compile PyInstaller's launcher from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "$env:RUNNER_TEMP\pyi-src"

          Write-Host "=== Cloning PyInstaller v6.22.3 ==="
          git clone --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git $src
          if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }

          Write-Host "=== Building bootloader (64-bit) ==="
          Push-Location "$src\bootloader"
          try {
            python ./waf all --target-arch=64bit
            if ($LASTEXITCODE -ne 0) { throw "waf failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          Write-Host "=== Installing custom PyInstaller and its dependencies ==="
          Push-Location $src
          try {
            # Do not use --no-deps: PyInstaller needs runtime dependencies such as pefile.
            python -m pip install --force-reinstall .
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          Write-Host "=== Verifying PyInstaller installation ==="
          python -m pip show PyInstaller pefile
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller or pefile is not installed" }
          pyinstaller --version
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller version check failed with exit code $LASTEXITCODE" }

      - name: Build EXE with custom PyInstaller
        run: |
          pyinstaller --clean --noconfirm TestLinkCRXMLGen.spec

      - name: List output
        run: |
          dir dist
          if (Test-Path dist\TestLinkCRXMLGen) { dir dist\TestLinkCRXMLGen }

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows-custom-launcher
          path: dist/TestLinkCRXMLGen/
          retention-days: 30
