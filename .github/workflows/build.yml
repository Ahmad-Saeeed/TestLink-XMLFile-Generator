
name: Build Windows EXE (official PyInstaller)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }

          # Use official PyInstaller instead of a custom bootloader
          python -m pip install "pyinstaller==6.22.3" "python-docx>=1.1.0" "lxml>=4.9.0"
          if ($LASTEXITCODE -ne 0) { throw "Installation failed" }

          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency check failed" }

          python -m PyInstaller --version

      - name: Build application (onedir, no UPX)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm --noupx TestLinkCRXMLGen.spec
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          if (!(Test-Path "dist\TestLinkCRXMLGen\TestLinkCRXMLGen.exe")) {
            throw "Executable not found"
          }

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          Get-FileHash "dist\TestLinkCRXMLGen\TestLinkCRXMLGen.exe" -Algorithm SHA256 |
            Format-List |
            Out-String |
            Tee-Object -FilePath "dist\TestLinkCRXMLGen\SHA256.txt"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkCRXMLGen-Windows-official-PyInstaller
          path: dist/TestLinkCRXMLGen/
          if-no-files-found: error
          retention-days: 30
